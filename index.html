<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميزان البحور - المنصة الشاملة للبحور الـ 16</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --primary: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container { max-width: 600px; margin: 0 auto; overflow-x: hidden; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        .input-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .part-result {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .part-title {
            overflow-wrap: anywhere;
            font-weight: bold;
            color: var(--primary);
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .tafila-blocks {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 12px 0;
        }
        .tafila-box {
            background: #0b0f19;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        .row-item {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 4px 12px;
            margin: 4px 0;
        }
        .label-text { font-size: 16px; color: #94a3b8; font-weight: bold; }
        .symbols { 
            letter-spacing: 2px; 
            font-size: 20px; 
            max-width: 100%;
            min-width: 0;
            word-break: break-all;
            text-align: left;
            font-family: monospace; 
            font-weight: bold;
            color: var(--success);
            direction: ltr; 
        }
        .tafila-name { font-size: 15px; color: var(--primary); font-weight: bold; }
        .site-footer { text-align: center; color: #64748b; font-size: 13px; margin: 30px 0 10px; padding-top: 15px; border-top: 1px solid #1e293b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎼 ميزان البحور الرقمي الشامل</h1>
        <p style="font-size:14px; color:#94a3b8;">محرك عروضي شامل ومطور لكافة تفريعات البحور الـ 16</p>
    </header>

    <div class="input-section">
        <label style="font-size:14px; display:block; margin-bottom:8px;">أدخل بيتاً واحداً أو عدة أبيات (كل بيت في سطر مستقل)، مع التشكيل الكامل، وافصل بين شطري كل بيت بنجمة *:</label>
        <textarea id="poemInput" placeholder="مثال:&#10;وَلَسْتَ بِمُسْتَبْقٍ أَخًا لَا تَلُمُّهُ * عَلَى شَعَثٍ أَيُّ الرِّجَالِ الْمُهَذَّبُ&#10;بيت ثانٍ * عجزه هنا"></textarea>
        <button onclick="processFullPoem()">تحليل القصيدة والحكم العروضي تلقائياً ✨</button>
    </div>

    <div id="resultsArea"></div>

    <footer class="site-footer">جميع الحقوق محفوظة : باسم أبو أنس 2026</footer>
</div>

<!-- قاعدة البيانات والمحرك مضمّنان في هذا الملف -->
<script>
// bahrData.js — بيانات البحور الـ16 (الرمز: / = متحرك ، 0 = ساكن)
// FEET: كل تفعيلة وفروعها  [النمط، الاسم]
const FEET = {
  fal:['//0/0','فَعُولُنْ'], falQ:['//0/','فَعُولُ (مقبوضة)'], falH:['//0','فَعُو (محذوفة)'], falB:['/0','فَعْ (مبتورة)'],
  maf:['//0/0/0','مَفَاعِيلُنْ'], mafQ:['//0//0','مَفَاعِلُنْ (مقبوضة)'], mafK:['//0/0/','مَفَاعِيلُ (مكفوفة)'],
  fat:['/0//0/0','فَاعِلَاتُنْ'], fatKh:['///0/0','فَعِلَاتُنْ (مخبونة)'], fatH:['/0//0','فَاعِلَا (محذوفة)'], fatKhH:['///0','فَعِلَا (مخبونة محذوفة)'],
  fan:['/0//0','فَاعِلُنْ'], fanKh:['///0','فَعِلُنْ (مخبونة)'], fanQ:['/0/0','فَاعِلْ (مقطوعة)'],
  mus:['/0/0//0','مُسْتَفْعِلُنْ'], musKh:['//0//0','مُتَفْعِلُنْ (مخبونة)'], musT:['/0///0','مُسْتَعِلُنْ (مطوية)'], musKl:['////0','مُتَعِلُنْ (مخبولة)'], musQ:['/0/0/0','مُسْتَفْعِلْ (مقطوعة)'],
  mut:['///0//0','مُتَفَاعِلُنْ'], mutM:['/0/0//0','مُتْفَاعِلُنْ (مضمرة)'], mutQ:['///0/0','مُتَفَاعِلْ (مقطوعة)'],
  mfl:['//0///0','مَفَاعَلَتُنْ'], mflE:['//0/0/0','مُفَاعَلْتُنْ (معصوبة)'],
  mfu:['/0/0/0/','مَفْعُولَاتُ'], mfuT:['/0//0/','مَفْعُلَاتُ (مطوية)']
};

// BAHRS: تفعيلات الشطر الواحد؛ كل موضع = التفعيلة الأصلية أولاً ثم ما يجوز فيها من زحافات وعلل
// majzu: يجوز مجيئه مجزوءاً (بحذف تفعيلة من كل شطر)
const BAHRS = [
  { name:'الطويل',  feet:[['fal','falQ'],['maf','mafQ'],['fal','falQ'],['mafQ','maf','fal']] },
  { name:'المديد',  majzu:true, feet:[['fat','fatKh'],['fan','fanKh'],['fat','fatKh','fatH','fatKhH']] },
  { name:'البسيط',  feet:[['mus','musKh'],['fan','fanKh'],['mus','musKh'],['fan','fanKh','fanQ']] },
  { name:'الوافر',  majzu:true, feet:[['mfl','mflE'],['mfl','mflE'],['fal','mfl']] },
  { name:'الكامل',  majzu:true, feet:[['mut','mutM'],['mut','mutM'],['mut','mutM','mutQ']] },
  { name:'الهزج',   feet:[['maf','mafK'],['maf','fal']] },
  { name:'الرجز',   majzu:true, feet:[['mus','musKh','musT','musKl'],['mus','musKh','musT','musKl'],['mus','musKh','musT','musKl','musQ']] },
  { name:'الرمل',   majzu:true, feet:[['fat','fatKh'],['fat','fatKh'],['fat','fatKh','fatH','fatKhH']] },
  { name:'السريع',  feet:[['mus','musKh','musT','musKl'],['mus','musKh','musT','musKl'],['fan','fanKh','fanQ']] },
  { name:'المنسرح', feet:[['mus','musKh','musT'],['mfu','mfuT'],['mus','musKh','musT','musQ']] },
  { name:'الخفيف',  majzu:true, feet:[['fat','fatKh'],['mus','musKh'],['fat','fatKh','fatH','fatKhH']] },
  { name:'المضارع', feet:[['mafK','maf'],['fat','fatKh']] },
  { name:'المقتضب', feet:[['mfu','mfuT'],['mus','musKh','musT']] },
  { name:'المجتث',  feet:[['musKh','mus'],['fatKh','fat']] },
  { name:'المتقارب',feet:[['fal','falQ'],['fal','falQ'],['fal','falQ'],['fal','falQ','falH','falB']] },
  { name:'المتدارك',feet:[['fan','fanKh','fanQ'],['fan','fanKh','fanQ'],['fan','fanKh','fanQ'],['fan','fanKh','fanQ']] }
];

// prosodyEngine.js — محرك التقطيع الصوتي والعروضي (/ = متحرك ، 0 = ساكن)
// يعتمد على: FEET و BAHRS من bahrData.js
const MARKS = {'\u064E':'a','\u064F':'u','\u0650':'i','\u0652':'o','\u0651':'s','\u064B':'A','\u064C':'U','\u064D':'I','\u0670':'d'};
// كلمات تُلفظ بألف لا تُكتب: الرقم = موضع الحرف الذي تلحقه الألف
const SPECIAL = {'هذا':0,'هذه':0,'هذي':0,'هذان':0,'ذلك':0,'ذلكم':0,'لكن':0,'الله':2,'لله':1,'الرحمن':4};
const PREFIX = 'وفبكل';

// قاموس الكلمات المبنية (ثابتة التشكيل مهما تغير موقعها في الجملة: حروف الجر والعطف والاستفهام والشرط،
// أسماء الإشارة، الأسماء الموصولة، الضمائر المنفصلة). إن كتبها المستخدم بلا أي تشكيل إطلاقاً تُشكَّل تلقائياً،
// فلا تُحسب "حروفاً بلا تشكيل" ولا يُخطئ المحرك في تقطيعها. لا يشمل القاموس أسماء معربة (ككل، بعض، غير)
// لأن حركة آخرها تتغير بحسب موقعها الإعرابي، وتخمينها قد يكون خاطئاً.
const COMMON_RAW = [
  "مِنْ","إِلَى","عَنْ","عَلَى","فِي","مَعَ","حَتَّى","مُنْذُ","مُذْ",
  "وَ","فَ","ثُمَّ","أَوْ","أَمْ","بَلْ","لَكِنْ","لَا","هَلْ","قَدْ","لَقَدْ",
  "لَنْ","لَمْ","لَمَّا","لَوْ","لَوْلَا","إِنْ","أَنْ","إِذَا","إِذْ","كَيْ","لِكَيْ",
  "يَا","أَلَا","أَمَّا","إِمَّا","كَلَّا","نَعَمْ","بَلَى","أَجَلْ","كَأَنَّ","لَعَلَّ","لَيْتَ",
  "هَذَا","هَذِهِ","هَذَانِ","هَاتَانِ","هَؤُلَاءِ","ذَلِكَ","تِلْكَ","أُولَئِكَ","هُنَا","هُنَاكَ",
  "الَّذِي","الَّتِي","الَّذِينَ","اللَّذَانِ","اللَّتَانِ","اللَّوَاتِي","اللَّاتِي",
  "أَنَا","أَنْتَ","أَنْتُمَا","أَنْتُمْ","أَنْتُنَّ","هُوَ","هِيَ","هُمَا","هُمْ","هُنَّ","نَحْنُ"
];
const COMMON_WORDS = {};
COMMON_RAW.forEach(w => { COMMON_WORDS[w.replace(/[ً-ْٰ]/g, '')] = w; });

function parseWord(w) {
  const L = [];
  w = w.replace(/\u0671/g, 'ا').replace(/ى/g, 'ا');
  for (const ch of w) {
    if (ch >= '\u0621' && ch <= '\u064A') {
      if (ch === 'آ') L.push({c:'أ', m:{a:1}}, {c:'ا', m:{}});
      else L.push({c:ch, m:{}});
    } else if (MARKS[ch] && L.length) L[L.length - 1].m[MARKS[ch]] = 1;
  }
  L.forEach(x => {
    const m = x.m;
    x.v = (m.a || m.d || m.A) ? 'a' : (m.u || m.U) ? 'u' : (m.i || m.I) ? 'i' : null;
    x.tan = !!(m.A || m.U || m.I); x.sh = !!m.s; x.so = !!m.o; x.dg = !!m.d;
  });
  return L;
}

// إسقاط همزة الوصل وسط الكلام مع التقاء الساكنين
function dropWasl(out) {
  const p = out[out.length - 1];
  if (!p) return;
  if (p.mad) out.pop();          // حرف المد يُحذف
  else if (p.t === '0') p.t = '/'; // الساكن يُكسر
}

function scanPhones(text, ajuz) {
  const words = text.replace(/[^\u0621-\u0652\u0670\u0671\s]/g, ' ').replace(/\u0640/g, '').split(/\s+/).filter(Boolean);
  const out = []; let missing = 0;
  const push = (t, o) => out.push(Object.assign({t}, o));

  words.forEach((w, wi) => {
    // تشكيل تلقائي للكلمات المبنية الشائعة إن كُتبت بلا أي تشكيل إطلاقاً (لا يُبدَّل أي تشكيل وضعه المستخدم بنفسه)
    if (!/[ً-ْٰ]/.test(w)) {
      const lookupKey = w.replace(/ٱ/g, 'ا');
      if (COMMON_WORDS[lookupKey]) w = COMMON_WORDS[lookupKey];
      else if (COMMON_WORDS[w]) w = COMMON_WORDS[w];
    }
    const L = parseWord(w);
    if (!L.length) return;
    const sk = L.map(x => x.c).join('');
    for (const key in SPECIAL) for (const off of [0, 1]) {
      if (sk.slice(off) === key && (off === 0 || PREFIX.includes(L[0].c)) && L[off + SPECIAL[key]]) L[off + SPECIAL[key]].ma = true;
    }
    let i0 = 0;
    if (L[0].c === 'ا' && !L[0].v && !L[0].sh && !L[0].so && !L[0].tan) { // همزة وصل
      if (wi > 0) dropWasl(out); else if (!ajuz) push('/'); // أول العجز متصل بالصدر فتسقط همزته
      i0 = 1;
    }
    for (let i = i0; i < L.length; i++) {
      const x = L[i], p = L[i - 1] || null, n = L[i + 1] || null;
      if (x.c === 'ا') {
        if (x.tan) push('0', {tan:1});
        else if (i === 1 && PREFIX.includes(L[0].c) && n && ((n.c === 'ل' && !n.v && !n.tan) || (n.so && L.length >= 4))) { /* همزة وصل بعد واو/فاء/باء... */ }
        else if (p && p.v === 'a' && !p.tan) push('0', {mad:1});
        continue;
      }
      if (x.c === 'ل' && !x.v && !x.sh && !x.so && !x.tan && n && n.sh) continue; // لام شمسية
      if (x.c === 'ل' && !x.v && !x.sh && !x.tan && ((i === 1 && i0 === 1) || (i === 2 && PREFIX.includes(L[0].c) && L[1].c === 'ا' && !L[1].v))) { push('0'); continue; } // لام التعريف القمرية ولو بلا سكون
      if (((x.c === 'و' && p && p.v === 'u') || (x.c === 'ي' && p && p.v === 'i')) && !x.v && !x.sh && !x.tan) { push('0', {mad:1}); continue; }
      if (x.sh) { push('0'); push('/'); if (!x.v) missing++; }
      else if (x.v) push('/');
      else if (x.so) push('0');
      else { missing++; push((x.c === 'و' || x.c === 'ي') && i > 0 ? '0' : '/'); }
      if (x.dg) push('0', {mad:1});
      if (x.tan) push('0', {tan:1});
      if (x.ma) push('0', {mad:1});
    }
    // إشباع هاء الضمير بين متحركين
    const last = L[L.length - 1], nx = words[wi + 1] ? parseWord(words[wi + 1])[0] : null;
    if (last.c === 'ه' && (last.v === 'u' || last.v === 'i') && !last.tan && !last.sh && !/لله$/.test(sk) &&
        out.length > 1 && out[out.length - 2].t === '/' && nx && !(nx.c === 'ا' && !nx.v)) push('0', {mad:1});
  });
  return {phones: out, missing};
}

// آخر الشطر: إما ساكن (وقف) أو مُشبَع بحرف مد
function endings(ph) {
  const s = a => a.map(p => p.t).join('');
  const last = ph[ph.length - 1];
  if (!last) return [];
  const fix = a => [...new Set(a.map(x => x.replace(/00$/, '0')))]; // ساكنان في آخر الشطر يُعدّان ساكناً واحداً
  if (last.t === '0' && !last.tan) return fix([s(ph)]);
  const base = last.tan ? ph.slice(0, -1) : ph;
  return fix([s(base.slice(0, -1)) + '0', s(base) + '0']);
}

function matchBahr(sym) {
  const res = [];
  BAHRS.forEach(b => {
    const forms = [{n:b.name, f:b.feet}];
    if (b.majzu) {
      const f = b.feet.slice(0, -1);
      f[f.length - 1] = [...new Set([...f[f.length - 1], ...b.feet[b.feet.length - 1]])];
      forms.push({n:'مجزوء ' + b.name, f});
    }
    forms.forEach(({n, f}) => {
      const m = new RegExp('^' + f.map(k => '(' + k.map(x => FEET[x][0]).join('|') + ')').join('') + '$').exec(sym);
      if (!m) return;
      let score = 0;
      const feet = f.map((keys, i) => {
        const k = keys.find(x => FEET[x][0] === m[i + 1]);
        score += keys.indexOf(k);
        return {sym:m[i + 1], label:FEET[k][1]};
      });
      res.push({name:n, base:b.name, sym, feet, score});
    });
  });
  return res;
}

function analyzeHemistich(text, ajuz) {
  const {phones, missing} = scanPhones(text, ajuz);
  if (ajuz && phones[0] && phones[0].t === '0') phones.shift(); // ساكن أول العجز يلتحق بآخر الصدر
  const cands = endings(phones);
  const matches = [];
  cands.forEach(sym => matches.push(...matchBahr(sym)));
  matches.sort((a, b) => a.score - b.score);
  return {sym: matches.length ? matches[0].sym : (cands[0] || ''), cands, matches, missing};
}

// الحكم على البيت: بحر مشترك بين الشطرين = موزون ، وإلا فيه كسر
function judgeVerse(a, b) {
  const pairs = [];
  a.matches.forEach(x => {
    const y = b.matches.find(z => z.name === x.name);
    if (y && !pairs.some(p => p.name === x.name)) pairs.push({name:x.name, sadr:x, ajuz:y, score:x.score + y.score});
  });
  return pairs.sort((p, q) => p.score - q.score);
}

function textToProsodySymbols(text) { return analyzeHemistich(text).sym; }

</script>


<script>
function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const uniq = an => [...new Set(an.matches.map(m => m.name))].join('، ');

function renderPart(title, text, an, m) {
    const head = `<div class="part-title">${title}: ${esc(text)}</div>
        <div class="row-item"><span class="label-text">التقطيع الصوتي:</span>
        <span class="symbols" style="color:${m ? 'var(--success)' : 'var(--danger)'}">${an.sym}</span></div>`;
    if (!m) return `<div class="part-result">${head}<div class="badge badge-danger">⚠ لا يطابق أي بحر من البحور الستة عشر</div></div>`;
    const feet = m.feet.map(f => `<div class="tafila-box">
        <div class="row-item"><span class="label-text">التقطيع العروضي:</span><span class="symbols">${f.sym}</span></div>
        <div class="row-item"><span class="label-text">التفعيلة:</span><span class="tafila-name">${f.label}</span></div></div>`).join('');
    return `<div class="part-result">${head}<div class="tafila-blocks">${feet}</div></div>`;
}

function analyzeOneVerse(line, idx, multi) {
    const parts = line.split("*").map(s => s.trim());
    const label = multi ? `البيت ${idx + 1}` : "البيت";
    if (parts.length < 2 || !parts[0] || !parts[1]) {
        return { weighed: false, html: `<div class="part-result"><div class="badge badge-danger">⚠ ${label}: غير مفصول بنجمة * بين الشطرين</div><div style="font-size:14px">${esc(line)}</div></div>` };
    }

    const a = analyzeHemistich(parts[0], false), b = analyzeHemistich(parts[1], true);
    const pairs = judgeVerse(a, b), best = pairs[0];
    let verdict;
    if (best) {
        verdict = `<div class="part-result"><div class="badge badge-success">✅ ${label}: موزون — من بحر ${best.name}</div>` +
            (pairs.length > 1 ? `<div style="font-size:13px;color:#94a3b8">يحتمل أيضاً: ${pairs.slice(1).map(p => p.name).join('، ')}</div>` : '') + `</div>`;
    } else {
        let why = `الصدر على (${uniq(a)}) والعجز على (${uniq(b)}) ولا يجتمعان في بحر واحد`;
        if (!a.matches.length && !b.matches.length) why = 'الكسر في الشطرين، أو أن التشكيل غير كامل';
        else if (!a.matches.length) why = 'الكسر في الشطر الأول (الصدر)';
        else if (!b.matches.length) why = 'الكسر في الشطر الثاني (العجز)';
        verdict = `<div class="part-result"><div class="badge badge-danger">⚠ ${label}: فيه كسر</div><div style="font-size:14px">${why}</div></div>`;
    }
    const miss = a.missing + b.missing;
    if (miss) verdict += `<div class="part-result" style="color:#f59e0b;font-size:14px">⚠ في هذا البيت ${miss} حرفاً بلا تشكيل (ولا تشملها الكلمات الشائعة المُشكَّلة تلقائياً)، وقد تكون النتيجة غير دقيقة.</div>`;

    const html = verdict +
        renderPart(`${label} — الشطر الأول (الصدر)`, parts[0], a, best ? best.sadr : a.matches[0]) +
        renderPart(`${label} — الشطر الثاني (العجز)`, parts[1], b, best ? best.ajuz : b.matches[0]);
    return { weighed: !!best, html };
}

function processFullPoem() {
    const input = document.getElementById("poemInput").value;
    if (!input.trim()) { alert("الرجاء إدخال نص أولاً!"); return; }
    const lines = input.split("\n").map(l => l.trim()).filter(l => l !== "");
    if (!lines.length) { alert("الرجاء إدخال بيت واحد على الأقل!"); return; }

    const multi = lines.length > 1;
    let weighedCount = 0;
    let bodyHtml = "";
    lines.forEach((line, idx) => {
        const r = analyzeOneVerse(line, idx, multi);
        if (r.weighed) weighedCount++;
        bodyHtml += r.html;
    });

    let summaryHtml = "";
    if (multi) {
        summaryHtml = `<div class="part-result">
            <div class="part-title" style="border-bottom:none;margin-bottom:0;">📊 ملخص القصيدة (${lines.length} أبيات)</div>
            <div style="font-size:15px;margin-top:8px;">موزون: <span style="color:var(--success);font-weight:bold;">${weighedCount}</span>
            &nbsp;—&nbsp; فيه كسر: <span style="color:var(--danger);font-weight:bold;">${lines.length - weighedCount}</span></div>
        </div>`;
    }

    document.getElementById("resultsArea").innerHTML = summaryHtml + bodyHtml;
}
</script>
